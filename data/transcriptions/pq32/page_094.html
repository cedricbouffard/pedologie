<p>96</p>

<p><em>Till</em> (argile à blocaux, — dépôt morainique) — Dépôt glaciaire non stratifié et hétérogène, de pierres, de sable, de limon et d'argile.<br>
<em>Type de sol</em> — Sol membre d'une série et ayant une texture de surface bien définie. La série peut comprendre un ou plusieurs types.</p>
