<div class="page-content" style="font-family: serif; font-size: 14px; line-height: 1.4; color: #000;">

  <div style="display: flex; justify-content: space-between; align-items: baseline; border-bottom: 2px solid #000; padding-bottom: 5px; margin-bottom: 20px;">
    <span style="font-size: 14px;">50</span>
    <span style="font-weight: bold; font-size: 16px; letter-spacing: 0.5px;">ÉTUDE DES SOLS DU COMTÉ DE NICOLET</span>
  </div>

  <h3 style="text-align: center; font-size: 15px; font-weight: bold; text-transform: uppercase; margin-bottom: 25px;">
    CARACTÉRISTIQUES DU PROFIL DES "GLEYS"
  </h3>

  <figure style="margin: 0; padding: 0;">
    <table style="width: 100%; border-collapse: collapse; border: 1px solid #000;">
      <thead>
        <tr>
          <th style="width: 15%; border: 1px solid #000; padding: 8px; text-align: center; vertical-align: middle; background-color: #f9f9f9;">Profondeur</th>
          <th style="width: 15%; border: 1px solid #000; padding: 8px; text-align: center; vertical-align: middle; background-color: #f9f9f9;">Horizon</th>
          <th style="width: 70%; border: 1px solid #000; padding: 8px; text-align: left; vertical-align: middle; background-color: #f9f9f9;">Description</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td style="border: 1px solid #000; padding: 8px; text-align: center; vertical-align: top;">0-pd</td>
          <td style="border: 1px solid #000; padding: 8px; text-align: center; vertical-align: top; font-weight: bold;">A<sup>oo</sup></td>
          <td style="border: 1px solid #000; padding: 8px; vertical-align: top;">
            Feuilles non tassées et débris organiques très peu décomposés; aussi appelé couche "L"; généralement présent dans les profils vierges, mais pouvant vite disparaître à la chute des feuilles.
          </td>
        </tr>
        <tr>
          <td style="border: 1px solid #000; padding: 8px; text-align: center; vertical-align: top;"></td>
          <td style="border: 1px solid #000; padding: 8px; text-align: center; vertical-align: top; font-weight: bold;">A<sup>o</sup></td>
          <td style="border: 1px solid #000; padding: 8px; vertical-align: top;">
            Enchevêtrement de débris organiques partiellement décomposés; aussi appelé couche "F"; généralement moins de deux pouces d'épaisseur.
          </td>
        </tr>
        <tr>
          <td style="border: 1px solid #000; padding: 8px; text-align: center; vertical-align: top;"></td>
          <td style="border: 1px solid #000; padding: 8px; text-align: center; vertical-align: top; font-weight: bold;">A'</td>
          <td style="border: 1px solid #000; padding: 8px; vertical-align: top;">
            Horizon noir composé de matière organique mêlée à la matière minérale; aussi appelé couche "H"; toujours présent.
          </td>
        </tr>
        <tr>
          <td style="border: 1px solid #000; padding: 8px; text-align: center; vertical-align: top;"></td>
          <td style="border: 1px solid #000; padding: 8px; text-align: center; vertical-align: top; font-weight: bold;">A<sup>2</sup></td>
          <td style="border: 1px solid #000; padding: 8px; vertical-align: top;">
            Horizon généralement plus pâle que les horizons supérieurs et inférieurs; probablement toujours présent, mais peut être souvent masqué par la matière organique.
          </td>
        </tr>
        <tr>
          <td style="border: 1px solid #000; padding: 8px; text-align: center; vertical-align: top;">1-pd</td>
          <td style="border: 1px solid #000; padding: 8px; text-align: center; vertical-align: top; font-weight: bold;">B<sup>2</sup></td>
          <td style="border: 1px solid #000; padding: 8px; vertical-align: top;">
            Horizon jaune clair à gris brun; toujours moucheté de rouille, quelquefois peu apparent.
          </td>
        </tr>
        <tr>
          <td style="border: 1px solid #000; padding: 8px; text-align: center; vertical-align: middle; font-weight: bold;">Solum</td>
          <td style="border: 1px solid #000; padding: 8px; text-align: center; vertical-align: middle; font-weight: bold;">G</td>
          <td style="border: 1px solid #000; padding: 8px; vertical-align: middle;">
            Horizon gris clair à gris jaunâtre; toujours moucheté de rouille; les limites des horizons inférieurs à A<sup>2</sup> sont toujours très diffuses.
          </td>
        </tr>
        <tr>
          <td style="border: 1px solid #000; padding: 8px; text-align: center; vertical-align: top;">2-pds</td>
          <td style="border: 1px solid #000; padding: 8px; text-align: center; vertical-align: top;"></td>
          <td style="border: 1px solid #000; padding: 8px; vertical-align: top;"></td>
        </tr>
        <tr>
          <td style="border: 1px solid #000; padding: 8px; text-align: center; vertical-align: middle; font-weight: bold;">Roche-mère</td>
          <td style="border: 1px solid #000; padding: 8px; text-align: center; vertical-align: middle; font-weight: bold;">C</td>
          <td style="border: 1px solid #000; padding: 8px; vertical-align: middle;">
            Matériaux peu ou pas altérés par le processus de formation du sol; les horizons A et B se sont formés aux dépens de matériaux semblables.
          </td>
        </tr>
        <tr>
          <td style="border: 1px solid #000; padding: 8px; text-align: center; vertical-align: top;">3-pds</td>
          <td style="border: 1px solid #000; padding: 8px; text-align: center; vertical-align: top;">
            <div style="text-align: center; font-weight: bold; font-size: 18px; line-height: 10px;">~ ~ ~<br/>~ ~ ~</div>
          </td>
          <td style="border: 1px solid #000; padding: 8px; vertical-align: top;"></td>
        </tr>
        <tr>
          <td style="border: 1px solid #000; padding: 8px; text-align: center; vertical-align: middle; font-weight: bold;">Substratum</td>
          <td style="border: 1px solid #000; padding: 8px; text-align: center; vertical-align: middle; font-weight: bold;">D</td>
          <td style="border: 1px solid #000; padding: 8px; vertical-align: middle;">
            Matériaux géologiques différents de ceux de la roche-mère; peuvent ou ne peuvent pas avoir une influence sur le sol susjacent.
          </td>
        </tr>
      </tbody>
    </table>
  </figure>

</div>
