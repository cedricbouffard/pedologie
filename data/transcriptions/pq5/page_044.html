<div class="pedological-profile-document">
  <header>
    <p class="header-reference">Étude pédologique du comté de Bagot <span class="page-number">45</span></p>
    <h2 class="table-title">TABLEAU VIII</h2>
    <p class="subtitle">CARACTÉRISTIQUES DU PROFIL DES "PODZOLS"</p>
  </header>

  <figure class="profile-diagram-container">
    <table class="profile-table">
      <thead>
        <tr>
          <th class="col-depth">Profondeur</th>
          <th class="col-horizon">Horizon</th>
          <th class="col-description">Description</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td class="depth-cell" rowspan="4">0-pd</td>
          <td class="horizon-cell">A<sup>00</sup></td>
          <td class="desc-cell">Feuilles non tassées et débris organiques très peu décomposés; aussi appelé couche "L".</td>
        </tr>
        <tr>
          <td class="horizon-cell">A<sup>0</sup></td>
          <td class="desc-cell">Enchevêtrement de débris organiques partiellement décomposés; aussi appelé couche "F".</td>
        </tr>
        <tr>
          <td class="horizon-cell">A<sup>1</sup></td>
          <td class="desc-cell">Horizon noir composé de matière organique mêlée à la matière minérale; aussi appelé couche "H".</td>
        </tr>
        <tr>
          <td class="horizon-cell">A<sup>2</sup></td>
          <td class="desc-cell">Horizon pâle, gris cendré, représentant la zone du maximum de délavage.</td>
        </tr>
        <tr>
          <td class="depth-cell" rowspan="3">1-pd<br><br><span class="solum-label">Solum</span></td>
          <td class="horizon-cell">B<sup>1</sup></td>
          <td class="desc-cell">Horizon de transition apparent à B<sup>2</sup>, de couleur brun à brun jaunâtre ou rougeâtre; accumulation de la matière organique.</td>
        </tr>
        <tr>
          <td class="horizon-cell">B<sup>2</sup></td>
          <td class="desc-cell">Horizon brun à brun rougeâtrre, représentant la zone du maximum d'accumulation des sels de fer, d'aluminium, etc.; souvent compact.</td>
        </tr>
        <tr>
          <td class="depth-cell" rowspan="2">2-pds</td>
          <td class="horizon-cell">B<sup>3</sup></td>
          <td class="desc-cell">Horizon de transition de couleur gris jaunâtre.</td>
        </tr>
        <tr>
          <td class="depth-cell" rowspan="3"><span class="roche-mere-label">Roche-mère</span><br><br>3-pds</td>
          <td class="horizon-cell">C</td>
          <td class="desc-cell">Matériaux peu ou pas altérés par le processus de formation du sol; les horizons A et B se sont formés aux dépens de matériaux semblables.</td>
        </tr>
        <tr>
          <td colspan="2" class="break-cell">
            <div class="wavy-break"></div>
          </td>
        </tr>
        <tr>
          <td class="depth-cell"><span class="substratum-label">Substratum</span></td>
          <td class="horizon-cell">D</td>
          <td class="desc-cell">Matériaux géologiques différents de ceux de la roche-mère; peuvent ou ne peuvent pas avoir une influence sur le sol susjacent.</td>
        </tr>
      </tbody>
    </table>
  </figure>
</div>
