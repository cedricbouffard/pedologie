    <figcaption style="text-align: justify; margin-top: 1em; font-size: 0.95em;">
      A côté de ces podsols, il y a de petites étendues qui peuvent être classées comme sols podsoliques bruns, dans lesquels le lavage n'a pas été aussi prononcé à cause des conditions de climat ou de la nature des matériaux de formation, et il y a une meilleure distribution et une plus grande quantité d'éléments nutritifs pour les plantes. Ces sols se trouvent dans la partie extrême ouest du district et généralement à une plus faible altitude que les vrais podsols. La plupart d'entre eux révèlent une trace d'un horizon A<sub>2</sub>, et ils sont plutôt un type de transition que de vrais sols bruns podsolisés. La surface se compose d'une couche de <span style="display:inline-block; vertical-align:middle; text-align:center;"><span style="display:block; font-size:0.8em; border-bottom:1px solid black;">1</span><span style="display:block; font-size:0.8em;">2</span></span> pouce à 1 pouce de matière organique, reposant sur un horizon B brun ou brun jaunâtre foncé, qui se confond dans les matériaux de formation à une profondeur de 30 à 36 pouces. Il n'existe pas de couches distinctes comme dans les sols podsols et la transition de l'horizon B dans les matériaux de formation est graduelle. Les bases sont réparties d'une façon plus égale dans tout le profil et ces sols sont généralement meilleurs pour la culture. Un croquis d'un profil typique de cette région est donné ci-dessous:
