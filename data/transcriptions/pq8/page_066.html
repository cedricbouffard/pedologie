<h3>Sols de la classe 5</h3>

<p>Les sols de la classe 5 ne conviennent qu'à la production de plantes fourragères vivaces. Ils sont cependant susceptibles d'amélioration mais ne conviennent pas à une agriculture mécanisée.</p>
