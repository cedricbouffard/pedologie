<h3>Sols de la classe 3</h3>

<p>Les sols de la classe 3 présentent des restrictions qui réduisent en quelque sorte le choix des cultures ou nécessitent des mesures spéciales de conservation. Les restrictions ont généralement trait aux travaux de préparation du sol, d'ensemencement et de récolte.</p>
