<h3>Sols de la classe 7</h3>

<p>Les sols de la classe 7 ne conviennent nullement à l'agriculture. Ils présentent des limitations tellement sérieuses qu'ils ne sont pas arables et ne peuvent être convertis pour fin de pâturage.</p>
