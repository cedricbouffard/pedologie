<div class="page-content">
  <div class="page-header" style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 2rem;">
    <span class="running-title" style="font-size: 0.9rem; font-style: italic;">Étude des sols du comté d'Yamaska</span>
    <span class="page-number" style="font-size: 0.9rem;">49</span>
  </div>

  <section class="soil-profile-section">
    <h2 style="text-align: center; font-size: 1.1rem; font-weight: bold; margin-bottom: 1.5rem; text-transform: uppercase;">Caractéristiques du profil des "Gleys"</h2>

    <figure style="margin: 0; padding: 0;">
      <table style="width: 100%; border-collapse: collapse; font-size: 0.95rem;">
        <tbody>
          <tr>
            <td style="width: 15%; vertical-align: top; padding: 8px 12px; border-bottom: 1px solid #ddd;">
              <strong>0-pd</strong>
            </td>
            <td style="width: 10%; vertical-align: top; padding: 8px 12px; border-bottom: 1px solid #ddd; text-align: center; font-family: monospace; font-weight: bold;">
              A<sup>00</sup>
            </td>
            <td style="width: 75%; vertical-align: top; padding: 8px 12px; border-bottom: 1px solid #ddd;">
              Feuilles non tassées et débris organiques très peu décomposés; aussi appelé couche "L"; généralement présent dans les profils vierges, mais pouvant vite disparaître à la chute des feuilles.
            </td>
          </tr>
          <tr>
            <td style="vertical-align: top; padding: 8px 12px; border-bottom: 1px solid #ddd;"></td>
            <td style="vertical-align: top; padding: 8px 12px; border-bottom: 1px solid #ddd; text-align: center; font-family: monospace; font-weight: bold;">
              A<sup>0</sup>
            </td>
            <td style="vertical-align: top; padding: 8px 12px; border-bottom: 1px solid #ddd;">
              Enchevêtrement de débris organiques partiellement décomposés; aussi appelé couche "F"; généralement moins de deux pouces d'épaisseur.
            </td>
          </tr>
          <tr>
            <td style="vertical-align: top; padding: 8px 12px; border-bottom: 1px solid #ddd;"></td>
            <td style="vertical-align: top; padding: 8px 12px; border-bottom: 1px solid #ddd; text-align: center; font-family: monospace; font-weight: bold;">
              A<sup>1</sup>
            </td>
            <td style="vertical-align: top; padding: 8px 12px; border-bottom: 1px solid #ddd;">
              Horizon noir composé de matière organique mêlée à la matière minérale; aussi appelé couche "H"; toujours présent.
            </td>
          </tr>
          <tr>
            <td style="vertical-align: top; padding: 8px 12px; border-bottom: 1px solid #ddd;"></td>
            <td style="vertical-align: top; padding: 8px 12px; border-bottom: 1px solid #ddd; text-align: center; font-family: monospace; font-weight: bold;">
              A<sup>2</sup>
            </td>
            <td style="vertical-align: top; padding: 8px 12px; border-bottom: 1px solid #ddd;">
              Horizon généralement plus pâle que les horizons supérieurs et inférieurs; probablement toujours présent, mais peut être souvent masqué par la matière organique.
            </td>
          </tr>
          <tr>
            <td style="vertical-align: top; padding: 8px 12px; border-bottom: 1px solid #ddd;">
              <strong>1-pd</strong>
            </td>
            <td style="vertical-align: top; padding: 8px 12px; border-bottom: 1px solid #ddd; text-align: center; font-family: monospace; font-weight: bold;">
              B<sup>2</sup>
            </td>
            <td style="vertical-align: top; padding: 8px 12px; border-bottom: 1px solid #ddd;">
              Horizon jaune clair à gris brun; toujours moucheté de rouille, quelquefois peu apparent.
            </td>
          </tr>
          <tr>
            <td style="vertical-align: top; padding: 8px 12px; border-bottom: 1px solid #ddd;">
              <strong>Solum</strong>
            </td>
            <td style="vertical-align: top; padding: 8px 12px; border-bottom: 1px solid #ddd; text-align: center; font-family: monospace; font-weight: bold;">
              G
            </td>
            <td style="vertical-align: top; padding: 8px 12px; border-bottom: 1px solid #ddd;">
              Horizon gris clair à gris jaunâtre; toujours moucheté de rouille; les limites des horizons inférieurs à A<sup>2</sup> sont toujours très diffuses.
            </td>
          </tr>
          <tr>
            <td style="vertical-align: top; padding: 8px 12px; border-bottom: 1px solid #ddd;">
              <strong>2-pds</strong>
            </td>
            <td style="vertical-align: top; padding: 8px 12px; border-bottom: 1px solid #ddd; text-align: center; font-family: monospace; font-weight: bold;">
              C
            </td>
            <td style="vertical-align: top; padding: 8px 12px; border-bottom: 1px solid #ddd;">
              Matériaux peu ou pas altérés par le processus de formation du sol; les horizons A et B se sont formés aux dépens de matériaux semblables.
            </td>
          </tr>
          <tr>
            <td style="vertical-align: top; padding: 8px 12px; border-bottom: 1px solid #ddd;">
              <strong>Roche-mère</strong>
            </td>
            <td style="vertical-align: top; padding: 8px 12px; border-bottom: 1px solid #ddd; text-align: center; font-family: monospace; font-weight: bold;">
              ~ ~ ~<br>~ ~ ~
            </td>
            <td style="vertical-align: top; padding: 8px 12px; border-bottom: 1px solid #ddd;"></td>
          </tr>
          <tr>
            <td style="vertical-align: top; padding: 8px 12px; border-bottom: none;">
              <strong>3-pds</strong><br><br><br>
              <strong>Substratum</strong>
            </td>
            <td style="vertical-align: top; padding: 8px 12px; border-bottom: none; text-align: center; font-family: monospace; font-weight: bold;">
              <br><br><br>
              D
            </td>
            <td style="vertical-align: top; padding: 8px 12px; border-bottom: none;">
              <br><br><br>
              Matériaux géologiques différents de ceux de la roche-mère; peuvent ou ne peuvent pas avoir une influence sur le sol susjacent.
            </td>
          </tr>
        </tbody>
      </table>
    </figure>
  </section>
</div>
