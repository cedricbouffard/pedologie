  <h2>CARACTÉRISTIQUES DU PROFIL DES "PODZOLS"</h2>

  <figure class="profile-figure">
    <table class="profile-table">
      <tbody>
        <tr>
          <td class="depth-marker">0-pd</td>
          <td class="horizon-code">A⁰⁰</td>
          <td class="horizon-desc">Feuilles non tassées et débris organiques très peu décomposés; aussi appelé couche "L".</td>
        </tr>
        <tr>
          <td></td>
          <td class="horizon-code">A⁰</td>
          <td class="horizon-desc">Enchevêtrement de débris organiques partiellement décomposés; aussi appelé couche "F".</td>
        </tr>
        <tr>
          <td></td>
          <td class="horizon-code">A¹</td>
          <td class="horizon-desc">Horizon noir composé de matière organique mêlée à la matière minérale; aussi appelé couche "H".</td>
        </tr>
        <tr>
          <td></td>
          <td class="horizon-code">A²</td>
          <td class="horizon-desc">Horizon pâle, gris cendré, représentant la zone du maximum de délavage.</td>
        </tr>
        <tr>
          <td class="depth-marker">1-pd</td>
          <td class="horizon-code">B¹</td>
          <td class="horizon-desc">Horizon de transition apparent à B², de couleur brun à brun jaunâtre ou rougeâtre; accumulation de la matière organique.</td>
        </tr>
        <tr>
          <td class="solum-label" rowspan="3">Solum</td>
          <td class="horizon-code">B²</td>
          <td class="horizon-desc">Horizon brun à brun rougeâtre, représentant la zone du maximum d'accumulation des sels de fer, d'aluminium, etc.; souvent compact.</td>
        </tr>
        <tr>
          <td class="depth-marker">2-pds</td>
          <td class="horizon-code">B³</td>
          <td class="horizon-desc">Horizon de transition de couleur gris jaunâtre.</td>
        </tr>
        <tr>
          <td class="parent-material-label" rowspan="2">Roche-mère</td>
          <td class="horizon-code">C</td>
          <td class="horizon-desc">Matériaux peu ou pas altérés par le processus de formation du sol; les horizons A et B se sont formés aux dépens de matériaux semblables.</td>
        </tr>
        <tr>
          <td class="depth-marker">3-pds</td>
          <td class="break-line" colspan="2"></td>
        </tr>
        <tr>
          <td class="substratum-label">Substratum</td>
          <td class="horizon-code">D</td>
          <td class="horizon-desc">Matériaux géologiques différents de ceux de la roche-mère; peuvent ou ne peuvent pas avoir une influence sur le sol susjacent.</td>
        </tr>
      </tbody>
    </ul>
